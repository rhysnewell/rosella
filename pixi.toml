[workspace]
authors = ["Rhys Newell <rhys.newell94@gmail.com>", "Ben Woodcroft <benjwoodcroft@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "rosella"
platforms = ["linux-64", "osx-arm64"]
version = "0.6.0"
license = "GPL-3.0-only"

# The mapper shells out to these binaries, so they are runtime dependencies and not crates.
[dependencies]
minimap2 = "*"
samtools = "*"

[feature.dev.dependencies]
extern = "*" # For release.py

[environments]
dev = ["dev"]
