[workspace]
authors = ["Rhys Newell <rhys.newell94@gmail.com>", "Ben Woodcroft <benjwoodcroft@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "rosella"
platforms = ["linux-64", "osx-arm64"]
version = "0.6.0"
license = "GPL-3.0-only"

# CovermEngine shells out to the coverm binary, so it is a runtime dependency and not
# just a crate.
[dependencies]
coverm = ">=0.6.1"
diamond = ">=2.1.11"
hmmer = ">=3.4"

[feature.dev.dependencies]
extern = "*" # For release.py

[environments]
dev = ["dev"]
