name: Build manual pages and deploy documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'src/cli.rs'
      - 'book.toml'
      - '.github/workflows/deploy-docs.yaml'
      - 'build_manuals.sh'
      - 'roff_to_md.sh'
      - 'prelude'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@mdbook

      - name: Build ROFF manual pages
        run: bash build_manuals.sh

      - name: Convert manual pages to markdown
        uses: docker://pandoc/core:3.7
        with:
          args: >-
            --from=man --to=markdown
            --output=docs/usage/rosella-recover.wd.md
            docs/usage/rosella-recover.wd.roff

      - name: Convert manual pages to markdown (refine)
        uses: docker://pandoc/core:3.7
        with:
          args: >-
            --from=man --to=markdown
            --output=docs/usage/rosella-refine.wd.md
            docs/usage/rosella-refine.wd.roff

      - name: Clean up markdown
        run: bash roff_to_md.sh

      - name: Build mdBook site
        run: mdbook build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: book/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
