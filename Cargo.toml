[package]
name = "rosella"
version = "1.0.0"
authors = ["Rhys Newell <rhys.newell94@gmail.com>"]
license = "GPL-3.0-only"
description = "Metagenome assembled genome recovery from composition and coverage"
homepage = "https://rhysnewell.github.io/rosella/"
repository = "https://github.com/rhysnewell/rosella"
documentation = "https://github.com/rhysnewell/rosella"
readme = "README.md"
exclude = [
  "tests/*",
  "images/*"
]
default-run = "rosella"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "^1.0"
clap = { version="^4", features = ["derive", "wrap_help"] }
csv = "^1.4"
env_logger = "^0.11"
libc = "0.2"
libm = "^0.2"
log = "0.4"
rayon = "^1.5.1"
tempfile = "^3.27"
ndarray = "^0.17"
needletail = "^0.7"
noodles-bam = "0.96"
noodles-bgzf = "0.52"
noodles-sam = "0.91"
zstd = "0.13"

rand = "0.9"
fastrand = { version = "2", default-features = false }
strobealign = "0.20"
sprs = "^0.11"
frugal = "^0.4.2"
tongs = "0.2.0"
flate2 = { version = "1.1.10", features = ["zlib-rs"] }
# The vendored minimap2 opens gzipped reads through C zlib, built static so no system zlib is needed.
libz-sys = { version = "^1.1", features = ["static"] }
indicatif = "^0.18"
jiff = "^0.2"
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
tar = { version = "0.4", default-features = false }

# Accelerate runs the learned space's products on the matrix unit, about twice the cores' rate.
# Metal ships with macOS, so --gpu needs nothing installed.
[target.'cfg(target_os = "macos")'.dependencies]
blas-src = { version = "0.10", features = ["accelerate"], default-features = false }
ndarray = { version = "^0.17", features = ["blas"] }
cblas-sys = "0.1"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-metal = { version = "0.3", default-features = false, features = ["std", "block2", "MTLAllocation", "MTLBuffer", "MTLCommandBuffer", "MTLCommandEncoder", "MTLCommandQueue", "MTLComputeCommandEncoder", "MTLComputePipeline", "MTLDevice", "MTLLibrary", "MTLResource", "MTLTypes"] }
objc2-metal-performance-shaders = { version = "0.3", default-features = false, features = ["std", "MPSCore", "MPSCoreTypes", "MPSKernel", "MPSMatrix", "MPSMatrixMultiplication"] }

# CUDA, cuBLAS and NVRTC load at run time under --gpu, so a build needs no CUDA installed.
[target.'cfg(not(target_os = "macos"))'.dependencies]
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "cublas", "nvrtc", "dynamic-loading", "cuda-12000"] }
# gemm picks its AVX-512 kernels at run time, so x86-v4 is safe on any x86 box.
gemm = { version = "0.19", default-features = false, features = ["std", "rayon", "x86-v4"] }

[build-dependencies]
cc = { version = "1.2", features = ["parallel"] }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit"] }

[dev-dependencies]
noodles-core = "0.21"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit"] }

[profile.dev]
codegen-units = 16

[profile.release]
strip = true
lto = true

# Release strips symbols, so a stage that looks slow cannot be attributed. Same codegen,
# symbols kept.
[profile.profiling]
inherits = "release"
debug = 1
strip = false

[profile.test]
opt-level = 3
