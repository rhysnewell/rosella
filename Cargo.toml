[package]
name = "rosella"
version = "0.6.0"
authors = ["Rhys Newell <rhys.newell94@gmail.com>"]
license = "GPL-3.0-only"
description = "Metagenome assembled genome recovery from composition and coverage"
homepage = "https://rhysnewell.github.io/rosella/"
repository = "https://github.com/rhysnewell/rosella"
documentation = "https://github.com/rhysnewell/rosella"
readme = "README.md"
exclude = [
  "tests/*"
]
default-run = "rosella"
edition = "2024"
rust-version = "1.85"

[dependencies]
anyhow = "^1.0"
clap = { version="^4", features = ["cargo", "derive", "wrap_help"] } # cargo for crate_version!
csv = "^1.4"
env_logger = "^0.11"
itertools = "^0.15"
log = "0.4"
rayon = "^1.5.1"
statrs = "^0.19"
tempfile = "^3.27"
ndarray = { version = "^0.17", features = ["rayon"] }
needletail = "^0.7"

rand = "0.9"
sprs = "^0.11"
frugal = { version = "0.4", git = "https://github.com/rhysnewell/frugal", rev = "b4f0e98" }
flate2 = "1.1.10"
indicatif = "^0.18"

[lib]
bench = false

